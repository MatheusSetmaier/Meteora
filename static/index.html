<!DOCTYPE html>
<html lang = 'pt-BR'>

<head>

    <meta charset = 'UTF-8'>
    <meta name = 'viewport' content = 'width=device-width, initial-scale = 1.0'>

    <title>Meteora</title>

    <link rel = 'stylesheet' href = '/static/style.css'>

    <link href = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap' rel = 'stylesheet'>

</head>

<body>

<div class = 'page'>

    <header>

        <div class = 'logo'>

            🌤️ <span>Meteora</span>

        </div>

        <div class = 'search'>

            <input
                type = 'text'
                id = 'cidade'
                placeholder = 'Buscar cidade...''>

            <button onclick = 'buscarClima()''>

                Buscar

            </button>

        </div>

        <div class = 'update'>

            Última atualização

            <span id = 'horaAtual'>

                --

            </span>

        </div>

    </header>

    <section class = 'hero'>

        <div class = 'hero-left'>

            <h2 id = 'cidadeNome'>

                Pesquise uma cidade

            </h2>

            <div class = 'temperature'>

                <span id = 'temperatura'>

                    --

                </span>

                <span class = 'icon' id = 'iconeClima'>

                    ☀️

                </span>

            </div>

            <h3 id = 'condicao'>

                Aguardando pesquisa...

            </h3>

            <p id = 'sensacao'>

                Sensação térmica --

            </p>

            <div class = 'miniCards'>

                <div class = 'miniCard'>

                    <span>Umidade</span>

                    <strong id = 'umidade'>

                        --

                    </strong>

                </div>

                <div class = 'miniCard'>

                    <span>Vento</span>

                    <strong id = 'vento'>

                        --

                    </strong>

                </div>

                <div class = 'miniCard'>

                    <span>Pressão</span>

                    <strong id = 'pressao'>

                        --

                    </strong>

                </div>

                <div class = 'miniCard'>

                    <span>Visibilidade</span>

                    <strong id = 'visibilidade'>

                        --

                    </strong>

                </div>

            </div>

        </div>

    </section>

    <section class = 'bottom'>

        <div class = 'card'>

            <h2>Previsão por hora</h2>

            <div id = 'previsaoHora' class = 'forecast-hour'>

                --

            </div>

            <canvas id = 'graficoTemperatura'></canvas>

        </div>

    </section>

</div>

<script src = 'https://cdn.jsdelivr.net/npm/chart.js'></script>
<script src = "/static/script.js"></script>

</body>

</html>
